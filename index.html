<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ハコニワメーカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=JetBrains+Mono:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/panel.css">
<link rel="stylesheet" href="styles/play.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app">
  <header class="bar">
    <div class="logo"><span>ハコニワ<b>メーカー</b></span><small>MINI 3D GAME MAKER</small></div>
    <div class="modes" role="group" aria-label="ギズモの操作">
      <button id="m-translate" aria-pressed="true" data-mode="translate">移動</button>
      <button id="m-rotate" aria-pressed="false" data-mode="rotate">回転</button>
      <button id="m-scale" aria-pressed="false" data-mode="scale">拡大</button>
    </div>
    <button id="playBtn" class="play">▶ 再生</button>
  </header>

  <div class="work">
    <div id="viewport">
      <div class="badge">編集中 · ドラッグで視点 · タップで選択</div>
      <div id="hud">★ 0</div>
      <div id="toast" hidden></div>
      <div id="endcard" hidden><div class="card"><h2 id="endTitle">クリア!</h2><p id="endText"></p><div class="row"><button class="btn primary" id="retryBtn">もう一度</button><button class="btn" id="backBtn">編集に戻る</button></div></div></div>
      <div id="log" hidden><button class="x" id="logClear" aria-label="ログを閉じる">×</button><div id="logLines"></div></div>
      <div id="touch" aria-hidden="true">
        <div class="dpad">
          <button class="u" data-k="ArrowUp">▲</button><button class="l" data-k="ArrowLeft">◀</button>
          <button class="r" data-k="ArrowRight">▶</button><button class="d" data-k="ArrowDown">▼</button>
        </div>
        <button class="jump" data-k="Space">ジャンプ</button>
      </div>
    </div>

    <section class="panel">
      <div class="tabs" role="tablist">
        <button role="tab" id="t-scene" data-tab="scene" aria-selected="false">シーン</button>
        <button role="tab" id="t-inspect" data-tab="inspect" aria-selected="true">インスペクタ</button>
        <button role="tab" id="t-assets" data-tab="assets" aria-selected="false">ロジック</button>
        <button class="link grow" id="growBtn" aria-label="パネルを広げる">⇕</button>
      </div>
      <div class="tabpane" id="tab-scene" hidden></div>
      <div class="tabpane" id="tab-inspect"></div>
      <div class="tabpane" id="tab-assets" hidden></div>
    </section>
  </div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
