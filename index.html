<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ハコニワメーカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=JetBrains+Mono:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* Layout: エディタ一式。3Dの舞台 + タブ式パネル(PCでは右、スマホでは下)。単一のダークな作業台ルックで統一 */
:root{
  color-scheme: dark;
  --ink:#141922;
  --panel:#1b212d;
  --raise:#252d3c;
  --line:#323c4f;
  --fg:#e8eaf0;
  --muted:#8f99ac;
  --accent:#f4c542;
  --accent-ink:#241a02;
  --go:#4fcf86;
  --stop:#ff6767;
  --x:#ff6b6b; --y:#5fd38a; --z:#5aa2ff;
  --font-display:'DotGothic16','Zen Kaku Gothic New',monospace;
  --font-ui:'Zen Kaku Gothic New','Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{
  height:100%;margin:0;overflow:hidden;
  background:var(--ink);color:var(--fg);
  font-family:var(--font-ui);font-size:14px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
  padding-block:0;
}
#app{height:100%;display:grid;grid-template-rows:auto 1fr;min-height:0}

/* ---------- header ---------- */
.bar{display:flex;align-items:center;gap:10px;padding-block:10px}
.logo{font-family:var(--font-display);font-size:20px;letter-spacing:.02em;white-space:nowrap;display:flex;align-items:baseline;gap:6px}
.logo b{color:var(--accent);font-weight:400}
.logo small{font-family:var(--font-ui);font-size:11px;color:var(--muted);letter-spacing:.08em}
.modes{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:2px;margin-left:auto}
.modes button{background:none;border:0;color:var(--muted);font:inherit;font-size:13px;padding:5px 10px;border-radius:7px;cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--raise);color:var(--fg)}
.modes button:disabled{opacity:.35;cursor:default}
.play{font:inherit;font-weight:700;font-size:14px;border:0;border-radius:9px;padding:7px 14px;cursor:pointer;background:var(--go);color:#062312;white-space:nowrap}
body.playing .play{background:var(--stop);color:#2b0505}

/* ---------- work area ---------- */
.work{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:10px;min-height:0;padding-block-end:max(12px, env(safe-area-inset-bottom,0px))}
#viewport{position:relative;min-height:0;min-width:0;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#a9cbe6}
#viewport canvas{display:block;width:100%;height:100%;touch-action:none}
.panel{display:grid;grid-template-rows:auto 1fr;min-height:0;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tabs{display:flex;align-items:center;gap:2px;padding:6px;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;color:var(--muted);font:inherit;font-size:13px;font-weight:700;padding:7px 4px;border-radius:7px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--raise);color:var(--fg)}
.tabs .grow{flex:0 0 auto;font-weight:400;padding:7px 10px;display:none}
.tabpane{overflow:auto;min-height:0;padding:12px 14px 18px}

@media (max-width:860px){
  .work{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(200px,50%) minmax(0,1fr)}
  body.panel-max .work{grid-template-rows:120px minmax(0,1fr)}
  body.playing .work{grid-template-rows:minmax(0,1fr)}
  body.playing .panel{display:none}
  .tabs .grow{display:block}
  .logo small{display:none}
}
@media (max-width:420px){
  .logo{font-size:17px}
  .modes button{padding:5px 8px}
}

/* ---------- viewport overlays ---------- */
.badge{position:absolute;left:10px;top:10px;font-size:12px;background:rgba(20,25,34,.72);color:var(--fg);padding:4px 9px;border-radius:999px;pointer-events:none;backdrop-filter:blur(4px)}
body.playing .badge{display:none}
#hud{position:absolute;left:10px;top:10px;display:none;font-family:var(--font-display);font-size:22px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);pointer-events:none}
body.playing #hud{display:block}
#toast{position:absolute;left:50%;top:18%;transform:translateX(-50%);font-family:var(--font-display);font-size:20px;color:#fff;background:rgba(20,25,34,.75);padding:6px 16px;border-radius:10px;pointer-events:none;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}
#endcard{position:absolute;inset:0;display:grid;place-items:center;background:rgba(20,25,34,.55);backdrop-filter:blur(2px)}
#endcard .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 26px;text-align:center;display:grid;gap:10px;max-width:86%}
#endcard h2{margin:0;font-family:var(--font-display);font-weight:400;font-size:30px;color:var(--accent)}
#endcard h2.lose{color:var(--stop)}
#endcard p{margin:0;color:var(--muted)}
#endcard .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px}
#log{position:absolute;left:8px;right:8px;bottom:8px;max-height:40%;overflow:auto;background:rgba(20,25,34,.88);border:1px solid var(--line);border-radius:9px;font-family:var(--font-mono);font-size:11.5px;padding:6px 30px 6px 10px}
#log div{padding:2px 0;white-space:pre-wrap;word-break:break-word}
#log .err{color:#ff9a9a}
#log .x{position:absolute;right:4px;top:3px;background:none;border:0;color:var(--muted);cursor:pointer;font-size:14px}
#touch{position:absolute;inset:auto 0 0 0;display:none;justify-content:space-between;align-items:flex-end;padding:14px;pointer-events:none}
@media (hover:none),(max-width:860px){ body.playing #touch{display:flex} body.playing #log{bottom:150px} }
.dpad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px);gap:2px;pointer-events:auto}
.dpad button,.jump{touch-action:none;user-select:none;-webkit-user-select:none;border:1px solid rgba(255,255,255,.35);background:rgba(20,25,34,.45);color:#fff;font-size:16px;border-radius:10px;cursor:pointer}
.dpad .u{grid-area:1/2}.dpad .l{grid-area:2/1}.dpad .r{grid-area:2/3}.dpad .d{grid-area:3/2}
.jump{pointer-events:auto;width:82px;height:82px;border-radius:50%;font:inherit;font-weight:700}
.dpad button.on,.jump.on{background:rgba(244,197,66,.6)}

/* ---------- panel content ---------- */
.sec{display:grid;gap:8px;padding-block:12px;border-bottom:1px solid var(--line)}
.sec:first-child{padding-top:2px}
.sec:last-child{border-bottom:0}
h3{margin:0;font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:8px}
h3 .count{font-family:var(--font-mono);background:var(--raise);color:var(--fg);border-radius:999px;padding:0 7px;letter-spacing:0}
h3 .sp{margin-left:auto}
label{display:grid;gap:3px;font-size:12px;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;font-size:13px;color:var(--fg);background:var(--ink);border:1px solid var(--line);border-radius:7px;padding:6px 8px;min-width:0;width:100%}
input[type=number]{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:12.5px}
input[type=color]{padding:2px;height:34px;cursor:pointer}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vec{display:grid;grid-template-columns:52px repeat(3,minmax(0,1fr));gap:5px;align-items:center}
.vec .vl{font-size:12px;color:var(--muted)}
.ax{display:flex;align-items:center;gap:0;position:relative}
.ax span{position:absolute;left:7px;font-family:var(--font-mono);font-size:10px;font-weight:600;pointer-events:none}
.ax input{padding-left:20px}
.ax-x span{color:var(--x)}.ax-y span{color:var(--y)}.ax-z span{color:var(--z)}
.hint{margin:0;font-size:12px;color:var(--muted)}
.btn{font:inherit;font-size:13px;color:var(--fg);background:var(--raise);border:1px solid var(--line);border-radius:7px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#4a5670}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.danger{color:#ff9a9a}
.btn.armed{background:var(--stop);color:#2b0505;border-color:var(--stop)}
.link{background:none;border:0;color:var(--muted);font:inherit;font-size:12px;cursor:pointer;padding:2px 4px;border-radius:5px}
.link:hover{color:var(--fg)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.empty{padding:26px 6px;color:var(--muted);text-align:center;font-size:13px}
.empty b{display:block;font-family:var(--font-display);font-weight:400;color:var(--fg);font-size:17px;margin-bottom:4px}

.shapes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.shapes button{display:grid;gap:1px;justify-items:center;padding:7px 2px}
.shapes .g{font-size:16px;color:var(--accent);line-height:1}
.shapes .t{font-size:11px;color:var(--muted)}

#hier{list-style:none;margin:0;padding:0;display:grid;gap:2px}
#hier button{width:100%;display:flex;align-items:center;gap:8px;text-align:left;background:none;border:1px solid transparent;color:var(--fg);font:inherit;font-size:13px;padding:6px 8px;border-radius:7px;cursor:pointer;min-width:0}
#hier button:hover{background:var(--raise)}
#hier button[aria-current="true"]{background:var(--raise);border-color:var(--accent)}
#hier .g{width:16px;text-align:center;flex:0 0 auto}
#hier .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{font-size:10.5px;padding:1px 7px;border-radius:999px;background:var(--ink);color:var(--muted);border:1px solid var(--line);white-space:nowrap;flex:0 0 auto}
.chip.tag{color:var(--accent);border-color:rgba(244,197,66,.4)}

.beh{border:1px solid var(--line);border-radius:9px;background:var(--ink);padding:9px 10px;display:grid;gap:8px}
.beh-h{display:flex;align-items:center;gap:4px}
.beh-name{font-weight:700;flex:1;min-width:0}
.beh-name::before{content:"◆ ";color:var(--accent);font-size:10px;vertical-align:2px}
.params{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 8px}
.params label.bool{display:flex;align-items:center;gap:6px}
.params label.bool input{width:18px}
.addrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px}

.alist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.alist button{text-align:left;background:var(--ink);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:7px 9px;cursor:pointer;font:inherit;display:grid;gap:0;min-width:0}
.alist button[aria-current="true"]{border-color:var(--accent);background:var(--raise)}
.alist .an{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alist .au{font-size:11px;color:var(--muted)}
.alist .new{border-style:dashed;color:var(--accent);align-content:center;font-weight:700}
.ptable{display:grid;gap:5px}
.prow{display:grid;grid-template-columns:minmax(0,1.1fr) 82px minmax(0,1fr) 28px;gap:5px;align-items:center}
.prow input:not([type=checkbox]){font-family:var(--font-mono);font-size:12px}
.prow .rm{background:none;border:0;color:var(--muted);cursor:pointer;font-size:15px}
.phead{font-size:11px;color:var(--muted)}
textarea.code{font-family:var(--font-mono);font-size:12.5px;line-height:1.55;min-height:300px;white-space:pre;overflow:auto;tab-size:2;resize:vertical;background:#10141b}
.status{font-family:var(--font-mono);font-size:11.5px;padding:5px 9px;border-radius:7px;background:var(--ink);border:1px solid var(--line);word-break:break-word}
.status.ok{color:var(--go)}
.status.bad{color:#ff9a9a;border-color:rgba(255,103,103,.5)}
details.api{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--ink)}
details.api summary{cursor:pointer;font-weight:700;font-size:13px}
.api dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;margin:10px 0 2px;font-size:12px}
.api dt{font-family:var(--font-mono);color:var(--accent);white-space:nowrap}
.api dd{margin:0;color:var(--muted)}
.api h4{grid-column:1/-1;margin:8px 0 0;font-size:11px;letter-spacing:.12em;color:var(--fg)}
textarea#io{font-family:var(--font-mono);font-size:11.5px;min-height:70px;resize:vertical}
.file{position:relative;overflow:hidden}
.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
.ok-note{color:var(--go);font-size:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div id="app">
  <header class="bar">
    <div class="logo"><span>ハコニワ<b>メーカー</b></span><small>MINI 3D GAME MAKER</small></div>
    <div class="modes" role="group" aria-label="ギズモの操作">
      <button id="m-translate" aria-pressed="true" data-mode="translate">移動</button>
      <button id="m-rotate" aria-pressed="false" data-mode="rotate">回転</button>
      <button id="m-scale" aria-pressed="false" data-mode="scale">拡大</button>
    </div>
    <button id="playBtn" class="play">▶ 再生</button>
  </header>

  <div class="work">
    <div id="viewport">
      <div class="badge">編集中 · ドラッグで視点 · タップで選択</div>
      <div id="hud">★ 0</div>
      <div id="toast" hidden></div>
      <div id="endcard" hidden><div class="card"><h2 id="endTitle">クリア!</h2><p id="endText"></p><div class="row"><button class="btn primary" id="retryBtn">もう一度</button><button class="btn" id="backBtn">編集に戻る</button></div></div></div>
      <div id="log" hidden><button class="x" id="logClear" aria-label="ログを閉じる">×</button><div id="logLines"></div></div>
      <div id="touch" aria-hidden="true">
        <div class="dpad">
          <button class="u" data-k="ArrowUp">▲</button><button class="l" data-k="ArrowLeft">◀</button>
          <button class="r" data-k="ArrowRight">▶</button><button class="d" data-k="ArrowDown">▼</button>
        </div>
        <button class="jump" data-k="Space">ジャンプ</button>
      </div>
    </div>

    <section class="panel">
      <div class="tabs" role="tablist">
        <button role="tab" id="t-scene" data-tab="scene" aria-selected="false">シーン</button>
        <button role="tab" id="t-inspect" data-tab="inspect" aria-selected="true">インスペクタ</button>
        <button role="tab" id="t-assets" data-tab="assets" aria-selected="false">ロジック</button>
        <button class="link grow" id="growBtn" aria-label="パネルを広げる">⇕</button>
      </div>
      <div class="tabpane" id="tab-scene" hidden></div>
      <div class="tabpane" id="tab-inspect"></div>
      <div class="tabpane" id="tab-assets" hidden></div>
    </section>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
<script>
(function(){
'use strict';
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r3 = n => Math.round(n*1000)/1000;
const DEG = Math.PI/180;

const SHAPES = {
  box:{label:'箱',glyph:'■'}, sphere:{label:'球',glyph:'●'}, cylinder:{label:'円柱',glyph:'▮'},
  cone:{label:'円錐',glyph:'▲'}, ring:{label:'リング',glyph:'◎'}
};
const BODIES = {
  none:['なし(飾り)','見た目だけ。当たり判定もありません。'],
  static:['固定(床・壁)','動かない足場や壁。ロジックで動かすと「動く床」になり、乗っているものを運びます。'],
  dynamic:['動く(重力あり)','重力で落ち、固定のものにぶつかって止まります。プレイヤー向け。'],
  trigger:['すり抜け(判定のみ)','ぶつからずに通り抜け、触れた瞬間だけ onCollide が呼ばれます。アイテムや敵向け。']
};

/* ================= 組み込みロジックアセット ================= */
const BUILTIN = [
{id:'move', name:'プレイヤー操作', desc:'矢印キー / WASD で移動、スペースでジャンプ。物理は「動く」にします。',
 params:[{key:'speed',type:'number',def:5},{key:'jump',type:'number',def:8}],
 code:`// 矢印キー / WASD で移動、スペースでジャンプ
return {
  update(dt) {
    let x = 0, z = 0;
    if (game.key('ArrowLeft')  || game.key('KeyA')) x -= 1;
    if (game.key('ArrowRight') || game.key('KeyD')) x += 1;
    if (game.key('ArrowUp')    || game.key('KeyW')) z -= 1;
    if (game.key('ArrowDown')  || game.key('KeyS')) z += 1;
    const len = Math.hypot(x, z) || 1;
    self.velocity.x = x / len * params.speed;
    self.velocity.z = z / len * params.speed;

    if (game.pressed('Space') && self.grounded) {
      self.velocity.y = params.jump;
    }
  }
};`},
{id:'camera', name:'カメラ追従', desc:'カメラがこのオブジェクトを後ろ上から追いかけます。',
 params:[{key:'distance',type:'number',def:8},{key:'height',type:'number',def:5}],
 code:`// カメラが後ろ上からついてくる
const goal = new THREE.Vector3();
return {
  update(dt) {
    goal.set(self.position.x,
             self.position.y + params.height,
             self.position.z + params.distance);
    // なめらかに近づける
    game.camera.position.lerp(goal, 1 - Math.exp(-dt * 5));
    game.camera.lookAt(self.position);
  }
};`},
{id:'spin', name:'回転', desc:'回り続けます。speed は1秒あたりの回転数。',
 params:[{key:'speed',type:'number',def:0.5}],
 code:`// 回り続ける
return {
  update(dt) {
    self.rotation.y += params.speed * Math.PI * 2 * dt;
  }
};`},
{id:'patrol', name:'往復移動', desc:'最初の位置を中心に、軸(x / y / z)に沿って行ったり来たりします。',
 params:[{key:'axis',type:'text',def:'x'},{key:'distance',type:'number',def:3},{key:'speed',type:'number',def:1}],
 code:`// 最初の位置を中心に往復する
const start = self.position.clone();
const axis = ['x', 'y', 'z'].includes(params.axis) ? params.axis : 'x';
let t = 0;
return {
  update(dt) {
    t += dt * params.speed;
    self.position.copy(start);
    self.position[axis] += Math.sin(t) * params.distance;
  }
};`},
{id:'pickup', name:'拾えるアイテム', desc:'target タグのものに触れられたら点数を足して消えます。',
 params:[{key:'points',type:'number',def:1},{key:'target',type:'text',def:'player'}],
 code:`// 触れられたら点数を足して消える
return {
  onCollide(other) {
    if (other.tag === params.target) {
      game.addScore(params.points);
      self.destroy();
    }
  }
};`},
{id:'goal', name:'ゴール', desc:'player が触れたらクリア。needScore 点以上が必要です。',
 params:[{key:'needScore',type:'number',def:3},{key:'message',type:'text',def:'ぜんぶ集めてゴール!'}],
 code:`// プレイヤーが触れたらクリア
return {
  onCollide(other) {
    if (other.tag !== 'player') return;
    if (game.score >= params.needScore) {
      game.win(params.message);
    } else {
      game.message('あと ' + (params.needScore - game.score) + ' 個!');
    }
  }
};`},
{id:'hazard', name:'触れたらアウト', desc:'player が触れるとゲームオーバー。',
 params:[{key:'message',type:'text',def:'敵にぶつかった!'}],
 code:`// プレイヤーが触れたらゲームオーバー
return {
  onCollide(other) {
    if (other.tag === 'player') game.lose(params.message);
  }
};`},
{id:'fall', name:'落下でアウト', desc:'高さ minY より下に落ちるとゲームオーバー。',
 params:[{key:'minY',type:'number',def:-8},{key:'message',type:'text',def:'落っこちた!'}],
 code:`// 下に落ちすぎたらゲームオーバー
return {
  update(dt) {
    if (self.position.y < params.minY) game.lose(params.message);
  }
};`},

// return の外の変数は、このオブジェクト専用のメモになります。
let elapsed = 0;
const baseY = self.position.y;

return {

function normalize(p){

const geoCache = {};
function geo(shape){
  if (!geoCache[shape]) geoCache[shape] = ({
    box: () => new THREE.BoxGeometry(1,1,1),
    sphere: () => new THREE.SphereGeometry(0.5, 32, 16),
    cylinder: () => new THREE.CylinderGeometry(0.5, 0.5, 1, 32),
    cone: () => new THREE.ConeGeometry(0.5, 1, 32),
    ring: () => new THREE.TorusGeometry(0.36, 0.13, 16, 40)
  })[shape]();
  return geoCache[shape];
}
function applyTransform(m, o){
  m.position.set(o.pos.x, o.pos.y, o.pos.z);
  m.rotation.set(o.rot.x*DEG, o.rot.y*DEG, o.rot.z*DEG);
  m.scale.set(o.scale.x || 0.01, o.scale.y || 0.01, o.scale.z || 0.01);
}
function makeMesh(o){
  const m = new THREE.Mesh(geo(o.shape), new THREE.MeshStandardMaterial({color:o.color, roughness:0.62, metalness:0.05}));
  m.castShadow = m.receiveShadow = true;
  applyTransform(m, o);
  return m;
}
const meshes = new Map();
function rebuildEditor(){

  project.objects.forEach(o => { const m = makeMesh(o); m.userData.id = o.id; editorGroup.add(m); meshes.set(o.id, m); });
}
function updateMesh(o){
  const m = meshes.get(o.id); if (!m) return;
  m.geometry = geo(o.shape); m.material.color.set(o.color); applyTransform(m, o);
}

let down = null;
renderer.domElement.addEventListener('pointerdown', e => {
  down = {x:e.clientX, y:e.clientY, gizmo: tc.axis !== null || tc.dragging};
});
renderer.domElement.addEventListener('pointerup', e => {
  if (!down || playing) { down = null; return; }
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6;
  const wasGizmo = down.gizmo; down = null;
  if (moved || wasGizmo) return;
  const rect = renderer.domElement.getBoundingClientRect();
  const ndc = new THREE.Vector2(((e.clientX - rect.left) / rect.width) * 2 - 1, -((e.clientY - rect.top) / rect.height) * 2 + 1);
  const ray = new THREE.Raycaster(); ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(editorGroup.children, false)[0];
  select(hit ? hit.object.userData.id : null, {fromView:true});
});

function syncTransformFields(){

    let v = parseFloat(t.value); if (!isFinite(v)) return;
    if (t.dataset.vec === 'scale' && Math.abs(v) < 0.01) v = 0.01;
    o[t.dataset.vec][t.dataset.axis] = v; updateMesh(o); save();
  } else if (t.dataset.bi !== undefined){
    const b = o.behaviors[+t.dataset.bi]; if (!b) return;
    const type = t.dataset.pt;
    const v = type === 'bool' ? t.checked : type === 'number' ? parseFloat(t.value) : t.value;
    if (type === 'number' && !isFinite(v)) return;
    b.params[t.dataset.pk] = v; save();
  }
});
inspect.addEventListener('change', e => {
  const t = e.target, o = getObj(selectedId); if (!o) return;
  if (t.dataset.f === 'shape'){ o.shape = t.value; updateMesh(o); renderHierarchy(); save(); }
  if (t.dataset.f === 'body'){ o.body = t.value; renderInspector(); save(); }
});
inspect.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const o = getObj(selectedId); if (!o) return;
  const act = b.dataset.act;
  if (act === 'add-beh'){ const id = $('#f-addasset').value; if (id){ o.behaviors.push({asset:id, params:{}}); renderInspector(); renderHierarchy(); save(); } }
  if (act === 'rm-beh'){ o.behaviors.splice(+b.dataset.i, 1); renderInspector(); renderHierarchy(); save(); }
  if (act === 'open-asset'){ selectedAssetId = b.dataset.id; showTab('assets'); }
  if (act === 'dup') duplicate(o.id);
  if (act === 'del') armed(b, 'もう一度押すと削除', () => removeObject(o.id));
});

/* ================= assets (logic) tab ================= */
const assetsTab = $('#tab-assets');
const usage = id => project.objects.reduce((n, o) => n + o.behaviors.filter(b => b.asset === id).length, 0);
function checkSyntax(code){
  try { new Function('self','params','game','THREE', code); return null; } catch(err){ return err.message; }
}
function renderAssets(){
  const a = getAsset(selectedAssetId);
  const list = project.assets.map(x => `<button data-aid="${esc(x.id)}" aria-current="${x.id === selectedAssetId}"><span class="an">${esc(x.name)}</span><span class="au">${usage(x.id)} か所で使用</span></button>`).join('');
  let ed = '<div class="empty">ロジックを選ぶと、コードとパラメータを編集できます。</div>';
  if (a){
    const err = checkSyntax(a.code);
    ed = `
    <div class="sec">
      <label>名前<input id="a-name" value="${esc(a.name)}"></label>
      <label>説明<input id="a-desc" value="${esc(a.desc)}" placeholder="何をするロジックか"></label>
    </div>
    <div class="sec"><h3>パラメータ<button class="link sp" data-act="add-param">+ 追加</button></h3>
      ${a.params.length ? `<div class="prow phead"><span>名前(params.○○)</span><span>種類</span><span>初期値</span><span></span></div>` : '<p class="hint">インスペクタで調整できる値です。コードからは params.名前 で読めます。</p>'}
      <div class="ptable">${a.params.map((p, i) => `<div class="prow">
        <input id="a-pk-${i}" data-pi="${i}" data-pf="key" value="${esc(p.key)}" aria-label="パラメータ名">
        <select id="a-pt-${i}" data-pi="${i}" data-pf="type" aria-label="種類">
          <option value="number" ${p.type === 'number' ? 'selected' : ''}>数値</option>
          <option value="text" ${p.type === 'text' ? 'selected' : ''}>文字</option>
          <option value="bool" ${p.type === 'bool' ? 'selected' : ''}>ON/OFF</option>
        </select>
        ${p.type === 'bool' ? `<input type="checkbox" id="a-pd-${i}" data-pi="${i}" data-pf="def" ${p.def ? 'checked' : ''} aria-label="初期値">`
          : `<input id="a-pd-${i}" data-pi="${i}" data-pf="def" ${p.type === 'number' ? 'type="number" step="any"' : ''} value="${esc(p.def)}" aria-label="初期値">`}
        <button class="rm" data-act="rm-param" data-i="${i}" aria-label="削除">×</button></div>`).join('')}</div>
    </div>
    <div class="sec"><h3>コード</h3>
      <textarea class="code" id="a-code" spellcheck="false" autocapitalize="off" autocomplete="off">${esc(a.code)}</textarea>
      <div id="a-status" class="status ${err ? 'bad' : 'ok'}">${err ? '書き間違い: ' + esc(err) : '✓ 構文OK'}</div>
      <details class="api"><summary>コードで使える命令</summary><dl>
        <h4>しくみ</h4>
        <dt>start()</dt><dd>再生開始時に1回</dd>
        <dt>update(dt)</dt><dd>毎フレーム。dt は経過秒</dd>
        <dt>onCollide(other)</dt><dd>何かに触れた瞬間。other は相手の self</dd>
        <dt>params.○○</dt><dd>上のパラメータの値</dd>
        <h4>self(このオブジェクト)</h4>
        <dt>position / rotation / scale</dt><dd>.x .y .z で読み書き(回転はラジアン)</dd>
        <dt>velocity</dt><dd>速度。物理が「動く」のとき有効</dd>
        <dt>grounded</dt><dd>何かの上に立っているか</dd>
        <dt>name / tag</dt><dd>名前とタグ</dd>
        <dt>startPosition</dt><dd>再生開始時の位置</dd>
        <dt>setColor('#ff0000')</dt><dd>色を変える</dd>
        <dt>destroy()</dt><dd>消える</dd>
        <h4>game</h4>
        <dt>key('ArrowUp')</dt><dd>押している間 true。KeyA〜KeyZ, Space なども</dd>
        <dt>pressed('Space')</dt><dd>押した瞬間だけ true</dd>
        <dt>score / addScore(n)</dt><dd>点数</dd>
        <dt>message('文字', 秒)</dt><dd>画面に表示</dd>
        <dt>win('文字') / lose('文字')</dt><dd>クリア / ゲームオーバー</dd>
        <dt>find('名前')</dt><dd>名前で他のオブジェクトを探す</dd>
        <dt>findAll('タグ')</dt><dd>タグで全部探す(配列)</dd>
        <dt>spawn('名前', {x,y,z})</dt><dd>そのオブジェクトをコピーして出す</dd>
        <dt>time / camera / log(…)</dt><dd>経過秒、カメラ、ログ表示</dd>
        <dt>THREE</dt><dd>three.js 本体(Vector3 など)</dd>
      </dl><p class="hint">スマホの画面ボタンは矢印キーと Space として届きます。</p></details>
    </div>
    <div class="sec"><div class="actions">
      <button class="btn" data-act="dup-asset">複製</button>
      ${BUILTIN_MAP[a.id] ? '<button class="btn" data-act="reset-asset">初期状態に戻す</button>' : ''}
      <button class="btn danger" data-act="del-asset">削除</button>
    </div></div>`;
  }
  assetsTab.innerHTML = `<div class="sec"><h3>ロジック一覧 <span class="count">${project.assets.length}</span></h3>
    <div class="alist">${list}<button class="new" data-act="new-asset">+ 新しいロジック</button></div></div>${ed}`;
}
let checkTimer;
assetsTab.addEventListener('input', e => {
  const t = e.target, a = getAsset(selectedAssetId); if (!a) return;
  if (t.id === 'a-name'){ a.name = t.value; const b = assetsTab.querySelector(`[data-aid="${CSS.escape(a.id)}"] .an`); if (b) b.textContent = a.name; renderInspector(); }
  else if (t.id === 'a-desc'){ a.desc = t.value; }
  else if (t.id === 'a-code'){
    a.code = t.value;
    clearTimeout(checkTimer);
    checkTimer = setTimeout(() => { const err = checkSyntax(a.code); const s = $('#a-status'); if (s){ s.className = 'status ' + (err ? 'bad' : 'ok'); s.textContent = err ? '書き間違い: ' + err : '✓ 構文OK'; } }, 350);
  } else if (t.dataset.pi !== undefined){
    const p = a.params[+t.dataset.pi]; if (!p) return;
    if (t.dataset.pf === 'key'){ const old = p.key; p.key = t.value.trim();
      project.objects.forEach(o => o.behaviors.forEach(b => { if (b.asset === a.id && old in b.params){ b.params[p.key] = b.params[old]; delete b.params[old]; } }));
    }
    if (t.dataset.pf === 'def') p.def = p.type === 'bool' ? t.checked : p.type === 'number' ? (parseFloat(t.value) || 0) : t.value;
    renderInspector();
  }
  save();
});
assetsTab.addEventListener('change', e => {
  const t = e.target, a = getAsset(selectedAssetId); if (!a) return;
  if (t.dataset.pf === 'type'){ const p = a.params[+t.dataset.pi]; p.type = t.value; p.def = t.value === 'bool' ? false : t.value === 'number' ? 0 : ''; renderAssets(); renderInspector(); save(); }
});
assetsTab.addEventListener('keydown', e => {
  if (e.target.id === 'a-code' && e.key === 'Tab' && !e.shiftKey){
    e.preventDefault(); const ta = e.target, s = ta.selectionStart;
    ta.setRangeText('  ', s, ta.selectionEnd, 'end'); ta.dispatchEvent(new Event('input', {bubbles:true}));
  }
});
assetsTab.addEventListener('click', e => {
  const ab = e.target.closest('[data-aid]'); if (ab){ selectedAssetId = ab.dataset.aid; renderAssets(); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = getAsset(selectedAssetId);
  switch (b.dataset.act){
    case 'new-asset': {
      const na = {id:'u' + Date.now().toString(36), name:'ふわふわ浮く', desc:'上下にゆれる(自作ロジックのひな形)',
        params:[{key:'height',type:'number',def:0.5},{key:'speed',type:'number',def:2}], code:NEW_ASSET_CODE};
      project.assets.push(na); selectedAssetId = na.id; renderAssets(); renderInspector(); save();
      setTimeout(() => { const ta = $('#a-code'); if (ta) ta.scrollIntoView({block:'nearest'}); }, 0);
      break; }
    case 'add-param': if (a){ a.params.push({key:'value' + (a.params.length + 1), type:'number', def:1}); renderAssets(); renderInspector(); save(); } break;
    case 'rm-param': if (a){ a.params.splice(+b.dataset.i, 1); renderAssets(); renderInspector(); save(); } break;
    case 'dup-asset': if (a){ const c = clone(a); c.id = 'u' + Date.now().toString(36); c.name = a.name + ' のコピー'; delete c.builtin; project.assets.push(c); selectedAssetId = c.id; renderAssets(); renderInspector(); save(); } break;
    case 'reset-asset': if (a && BUILTIN_MAP[a.id]) armed(b, 'もう一度押すと戻す', () => { Object.assign(a, clone(BUILTIN_MAP[a.id])); renderAssets(); renderInspector(); save(); }); break;
    case 'del-asset': if (a) armed(b, usage(a.id) ? `使用中の${usage(a.id)}か所からも外して削除` : 'もう一度押すと削除', () => {
      project.assets = project.assets.filter(x => x.id !== a.id);
      project.objects.forEach(o => { o.behaviors = o.behaviors.filter(x => x.asset !== a.id); });
      selectedAssetId = project.assets[0] ? project.assets[0].id : null;
      renderAssets(); renderInspector(); renderHierarchy(); save();
    }); break;
  }
});

/* ================= runtime (play mode) ================= */
const logBox = $('#log'), logLines = $('#logLines');
function log(text, isErr){
  const d = document.createElement('div'); d.textContent = text; if (isErr) d.className = 'err';
  logLines.appendChild(d); while (logLines.children.length > 40) logLines.firstChild.remove();
  logBox.hidden = false; logBox.scrollTop = logBox.scrollHeight;
}
$('#logClear').addEventListener('click', () => { logLines.innerHTML = ''; logBox.hidden = true; });
const PHASE = {start:'start', update:'update', onCollide:'onCollide', setup:'準備'};
function logErr(name, phase, err){ log(`「${name}」の ${PHASE[phase] || phase} でエラー: ${err && err.message ? err.message : err}`, true); }

let savedCam = null;
const tmpV = new THREE.Vector3();
const boxA = new THREE.Box3(), boxB = new THREE.Box3();

function createRuntime(){
  const r = {group:new THREE.Group(), ents:[], uid:0, score:0, time:0, ended:false,
    keys:new Set(), pressedNow:new Set(), contacts:new Set(), compiled:new Map(), msgT:0};
  scene.add(r.group);
  for (const a of project.assets){
    try { r.compiled.set(a.id, new Function('self','params','game','THREE', '"use strict";\n' + a.code)); }
    catch(err){ if (usage(a.id)) log(`「${a.name}」のコードに書き間違いがあります: ${err.message}`, true); }
  }
  r.game = {
    key: c => r.keys.has(c),
    pressed: c => r.pressedNow.has(c),
    get score(){ return r.score; }, set score(v){ r.score = Number(v) || 0; hud(); },
    addScore(n = 1){ r.score += Number(n) || 0; hud(); },
    get time(){ return r.time; },
    camera,
    message(t, sec = 1.6){ const el = $('#toast'); el.textContent = String(t); el.hidden = false; r.msgT = sec; },
    win(t){ endGame(true, t); },
    lose(t){ endGame(false, t); },
    find(name){ const e = r.ents.find(x => !x.dead && x.name === name); return e ? e.api : null; },
    findAll(tag){ return r.ents.filter(x => !x.dead && x.tag === tag).map(x => x.api); },
    spawn(name, pos){
      const d = project.objects.find(o => o.name === name);
      if (!d){ log(`spawn: 「${name}」という名前のオブジェクトがありません`, true); return null; }
      const e = spawnEntity(r, d, pos); callHook(e, 'start'); return e.api;
    },
    log(...a){ log(a.map(x => typeof x === 'object' ? JSON.stringify(x) : String(x)).join(' ')); }
  };
  rt = r;
  project.objects.forEach(d => spawnEntity(r, d));
  r.ents.slice().forEach(e => callHook(e, 'start'));
  hud();
}
function spawnEntity(r, data, pos){
  const mesh = makeMesh(data);
  if (pos) mesh.position.set(pos.x ?? mesh.position.x, pos.y ?? mesh.position.y, pos.z ?? mesh.position.z);
  r.group.add(mesh);
  const e = {uid:++r.uid, name:data.name, tag:data.tag, body:data.body, mesh, velocity:new THREE.Vector3(),
    grounded:false, ground:null, prevPos:mesh.position.clone(), start:mesh.position.clone(), dead:false, hooks:[]};
  e.api = {
    get name(){ return e.name; }, get tag(){ return e.tag; }, set tag(v){ e.tag = String(v); },
    position:mesh.position, rotation:mesh.rotation, scale:mesh.scale, velocity:e.velocity,
    get grounded(){ return e.grounded; }, get startPosition(){ return e.start.clone(); },
    get alive(){ return !e.dead; }, object3d:mesh,
    get body(){ return e.body; }, set body(v){ if (BODIES[v]) e.body = v; },
    setColor(c){ mesh.material.color.set(c); }, destroy(){ e.dead = true; }
  };
  r.ents.push(e);
  for (const b of data.behaviors){
    const a = getAsset(b.asset); if (!a) continue;
    const fn = r.compiled.get(a.id); if (!fn) continue;
    const params = {}; a.params.forEach(p => { params[p.key] = b.params[p.key] !== undefined ? b.params[p.key] : p.def; });
    try { const h = fn(e.api, params, r.game, THREE); if (h && typeof h === 'object') e.hooks.push({h, name:a.name}); }
    catch(err){ logErr(a.name, 'setup', err); }
  }
  return e;
}
function callHook(e, name, ...args){
  for (const k of e.hooks){
    if (k.broken || e.dead && name !== 'onCollide') continue;
    const f = k.h[name]; if (typeof f !== 'function') continue;
    try { f.apply(k.h, args); } catch(err){ k.broken = true; logErr(k.name, name, err); }
  }
}
const overlap = (a, b, eps) => a.max.x > b.min.x + eps && a.min.x < b.max.x - eps && a.max.y > b.min.y + eps && a.min.y < b.max.y - eps && a.max.z > b.min.z + eps && a.min.z < b.max.z - eps;
const boxOf = (e, out) => { e.mesh.updateMatrixWorld(); return out.setFromObject(e.mesh); };

function stepRuntime(dt){
  const r = rt;
  if (r.msgT > 0){ r.msgT -= dt; if (r.msgT <= 0) $('#toast').hidden = true; }
  if (r.ended){ r.pressedNow.clear(); return; }
  r.time += dt;
  for (const e of r.ents) e.prevPos.copy(e.mesh.position);
  for (const e of r.ents.slice()) if (!e.dead) callHook(e, 'update', dt);
  if (r.ended){ r.pressedNow.clear(); return; }

  // --- physics ---
  const G = project.settings.gravity;
  const solids = r.ents.filter(e => !e.dead && (e.body === 'static' || e.body === 'dynamic'));
  for (const d of r.ents){
    if (d.dead || d.body !== 'dynamic') continue;
    if (d.ground && !d.ground.dead) d.mesh.position.add(tmpV.subVectors(d.ground.mesh.position, d.ground.prevPos));
    d.velocity.y = Math.max(d.velocity.y - G * dt, -40);
    d.grounded = false; d.ground = null;
    for (const axis of ['x','y','z']){
      const delta = d.velocity[axis] * dt; if (!delta) continue;
      d.mesh.position[axis] += delta;
      for (const s of solids){
        if (s === d) continue;
        boxOf(d, boxA); boxOf(s, boxB);
        if (!overlap(boxA, boxB, 1e-4)) continue;
        if (delta > 0) d.mesh.position[axis] -= boxA.max[axis] - boxB.min[axis];
        else { d.mesh.position[axis] += boxB.max[axis] - boxA.min[axis]; if (axis === 'y'){ d.grounded = true; d.ground = s; } }
        d.velocity[axis] = 0;
      }
    }
  }
  // --- contacts (enter only) ---
  const live = r.ents.filter(e => !e.dead && e.body !== 'none');
  const boxes = live.map(e => boxOf(e, new THREE.Box3()).expandByScalar(0.02));
  const now = new Set();
  for (let i = 0; i < live.length; i++) for (let j = i + 1; j < live.length; j++){
    const a = live[i], b = live[j];
    if (a.body === 'static' && b.body === 'static') continue;
    if (!boxes[i].intersectsBox(boxes[j])) continue;
    const key = a.uid + ':' + b.uid; now.add(key);
    if (!r.contacts.has(key)){ callHook(a, 'onCollide', b.api); callHook(b, 'onCollide', a.api); }
  }
  r.contacts = now;
  // --- cleanup ---
  for (const e of r.ents) if (e.dead){ r.group.remove(e.mesh); e.mesh.material.dispose(); }
  r.ents = r.ents.filter(e => !e.dead);
  r.pressedNow.clear();
}
function hud(){ if (rt) $('#hud').textContent = '★ ' + rt.score; }
function endGame(win, text){
  if (!rt || rt.ended) return;
  rt.ended = true;
  const h = $('#endTitle'); h.textContent = win ? 'クリア!' : 'ゲームオーバー'; h.className = win ? '' : 'lose';
  $('#endText').textContent = (text ? text + ' · ' : '') + 'スコア ' + rt.score + ' · ' + rt.time.toFixed(1) + '秒';
  $('#endcard').hidden = false;
}
function disposeRuntime(){
  if (!rt) return;
  rt.ents.forEach(e => e.mesh.material.dispose());
  scene.remove(rt.group); rt = null;
  $('#endcard').hidden = true; $('#toast').hidden = true;
}
function startPlay(){
  if (playing) return;
  playing = true; document.body.classList.add('playing'); document.body.classList.remove('panel-max');
  $('#playBtn').textContent = '■ 停止';
  document.querySelectorAll('.modes button').forEach(b => b.disabled = true);
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  savedCam = {pos:camera.position.clone(), target:orbit.target.clone()};
  tc.detach(); selHelper.visible = false; editorGroup.visible = false; orbit.enabled = false;
  logLines.innerHTML = ''; logBox.hidden = true;
  createRuntime();
}
function restartPlay(){
  disposeRuntime();
  camera.position.copy(savedCam.pos); camera.lookAt(savedCam.target);
  logLines.innerHTML = ''; logBox.hidden = true;
  createRuntime();
}
function stopPlay(){
  if (!playing) return;
  disposeRuntime();
  playing = false; document.body.classList.remove('playing');
  $('#playBtn').textContent = '▶ 再生';
  document.querySelectorAll('.modes button').forEach(b => b.disabled = false);
  editorGroup.visible = true; orbit.enabled = true;
  if (savedCam){ camera.position.copy(savedCam.pos); orbit.target.copy(savedCam.target); orbit.update(); }
  touchKeys.clear(); document.querySelectorAll('#touch .on').forEach(b => b.classList.remove('on'));
  select(selectedId);
}
$('#playBtn').addEventListener('click', () => playing ? stopPlay() : startPlay());
$('#retryBtn').addEventListener('click', restartPlay);
$('#backBtn').addEventListener('click', stopPlay);

/* ---- input ---- */
const GAME_KEYS = new Set(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space']);
const inField = el => el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT' || el.isContentEditable);
window.addEventListener('keydown', e => {
  if (playing && rt){
    if (e.code === 'Escape'){ stopPlay(); return; }
    if (inField(e.target)) return;
    if (GAME_KEYS.has(e.code)) e.preventDefault();
    if (!rt.keys.has(e.code)) rt.pressedNow.add(e.code);
    rt.keys.add(e.code);
    return;
  }
  if (inField(e.target)) return;
  if ((e.key === 'Delete' || e.key === 'Backspace') && selectedId){ e.preventDefault(); removeObject(selectedId); }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'd' && selectedId){ e.preventDefault(); duplicate(selectedId); }
});
window.addEventListener('keyup', e => { if (rt) rt.keys.delete(e.code); });
window.addEventListener('blur', () => { if (rt) rt.keys.clear(); });
const touchKeys = new Set();
document.querySelectorAll('#touch [data-k]').forEach(btn => {
  const k = btn.dataset.k;
  const on = e => { e.preventDefault(); btn.classList.add('on'); try { btn.setPointerCapture(e.pointerId); } catch(_){}
    if (rt){ if (!rt.keys.has(k)) rt.pressedNow.add(k); rt.keys.add(k); } };
  const off = () => { btn.classList.remove('on'); if (rt) rt.keys.delete(k); };
  btn.addEventListener('pointerdown', on);
  btn.addEventListener('pointerup', off); btn.addEventListener('pointercancel', off); btn.addEventListener('lostpointercapture', off);
  btn.addEventListener('contextmenu', e => e.preventDefault());
});

/* ================= loop ================= */
const clock = new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 1/20);
  if (playing && rt) stepRuntime(dt);
  else { orbit.update(); if (selHelper.visible) selHelper.update(); }
  renderer.render(scene, camera);
}

/* ================= boot ================= */
applySettings();
rebuildEditor();
renderSceneTab();
select(selectedId);
showTab('inspect');
resize();
loop();
})();
</script>
</body>
